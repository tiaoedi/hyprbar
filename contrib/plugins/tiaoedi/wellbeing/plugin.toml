id = "tiaoedi/wellbeing"
name = "Bem-estar"
version = "1.1.0"
plugin_api = 22
author = "tiaoedi"
license = "MIT"
icon = "heart"
description = "Lembretes leves de água, descanso dos olhos e alongamento."

[[setting]]
key = "water_enabled"
type = "bool"
label_key = "settings.water_enabled"
default = true

[[setting]]
key = "water_minutes"
type = "int"
label_key = "settings.water_minutes"
default = 45
min = 1
max = 1440

[[setting]]
key = "eyes_enabled"
type = "bool"
label_key = "settings.eyes_enabled"
default = true

[[setting]]
key = "eyes_minutes"
type = "int"
label_key = "settings.eyes_minutes"
default = 20
min = 1
max = 1440

[[setting]]
key = "stretch_enabled"
type = "bool"
label_key = "settings.stretch_enabled"
default = true

[[setting]]
key = "stretch_minutes"
type = "int"
label_key = "settings.stretch_minutes"
default = 60
min = 1
max = 1440

[[widget]]
id = "wellbeing"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 610
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "reminders"
entry = "service.luau"
